name: Build WARP10 iPad4 iOS10 ARMv7

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Install Go 1.14.15
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL https://go.dev/dl/go1.14.15.linux-amd64.tar.gz -o /tmp/go.tgz
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf /tmp/go.tgz
          /usr/local/go/bin/go version


      - name: Install iOS ARMv7 linker and iPhoneOS 10.3 SDK
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y xz-utils libtinfo5

          curl -fL \
            https://github.com/sbingner/llvm-project/releases/download/v10.0.0-1/linux-ios-arm64e-clang-toolchain.tar.lzma \
            -o /tmp/ios-toolchain.tar.lzma
          rm -rf /tmp/ios-toolchain /opt/ios-toolchain
          mkdir -p /tmp/ios-toolchain
          tar --lzma -xf /tmp/ios-toolchain.tar.lzma -C /tmp/ios-toolchain
          sudo mv /tmp/ios-toolchain/ios-arm64e-clang-toolchain /opt/ios-toolchain

          curl -fL \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS10.3.sdk.tar.xz \
            -o /tmp/iPhoneOS10.3.sdk.tar.xz
          rm -rf /tmp/ios-sdk /opt/iPhoneOS10.3.sdk
          mkdir -p /tmp/ios-sdk
          tar -xJf /tmp/iPhoneOS10.3.sdk.tar.xz -C /tmp/ios-sdk
          sudo mv /tmp/ios-sdk/iPhoneOS10.3.sdk /opt/iPhoneOS10.3.sdk

          # Bingner's clang-10 is linked against the legacy terminfo ABI.
          # Install the real libtinfo5 package; a symlink to libtinfo6 is NOT ABI-compatible.
          ldconfig -p | grep 'libtinfo.so.5'

          sudo ln -sf /opt/ios-toolchain/bin/ld64 /opt/ios-toolchain/bin/ld
          export PATH=/opt/ios-toolchain/bin:$PATH
          /opt/ios-toolchain/bin/clang-10 --version
          /opt/ios-toolchain/bin/ld64 -v || true
          test -f /opt/iPhoneOS10.3.sdk/usr/lib/libSystem.tbd

          cat > /tmp/ios-clang <<'EOF'
          #!/bin/sh
          exec /opt/ios-toolchain/bin/clang-10 \
            -arch armv7 \
            -isysroot /opt/iPhoneOS10.3.sdk \
            -mios-version-min=10.0 \
            -B/opt/ios-toolchain/bin \
            "$@"
          EOF
          chmod +x /tmp/ios-clang

      - name: Fetch WireGuard and inject WARP10 main
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch 0.0.20200320 https://github.com/WireGuard/wireguard-go.git /tmp/wireguard-go
          echo '' | base64 -d > /tmp/wireguard-go/main.go

      - name: Cross-compile iOS10 darwin/arm GOARM=7 with ld64
        shell: bash
        run: |
          set -euxo pipefail
          export PATH=/usr/local/go/bin:/opt/ios-toolchain/bin:$PATH
          cd /tmp/wireguard-go
          export GO111MODULE=on
          export GOPROXY=https://proxy.golang.org,direct
          export GOOS=darwin
          export GOARCH=arm
          export GOARM=7
          export CGO_ENABLED=1
          export CC=/tmp/ios-clang
          export CXX=/tmp/ios-clang
          export CGO_CFLAGS='-arch armv7 -isysroot /opt/iPhoneOS10.3.sdk -mios-version-min=10.0'
          export CGO_CXXFLAGS="$CGO_CFLAGS"
          export CGO_LDFLAGS='-arch armv7 -isysroot /opt/iPhoneOS10.3.sdk -mios-version-min=10.0'
          go env
          go mod download
          mkdir -p "$GITHUB_WORKSPACE/out"

          # Go 1.14's own misc/ios/clangwrap.sh uses clang + armv7 + iOS SDK.
          # darwin/arm requires an external Apple linker, so use the bundled ld64.
          # Keep the log concise. On failure print the actual compiler/linker diagnostics
          # instead of hundreds of -x command lines.
          set +e
          go build -p 1 -trimpath \
            -ldflags='-linkmode=external -s -w' \
            -o "$GITHUB_WORKSPACE/out/warp10" . 2>&1 | tee "$GITHUB_WORKSPACE/out/build.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo '===== BUILD FAILED: relevant diagnostics ====='
            grep -Ein 'error:|undefined|failed|cannot|unsupported|unknown|ld:|clang:|link:' "$GITHUB_WORKSPACE/out/build.log" | tail -n 120 || true
            echo '===== LAST 120 LINES ====='
            tail -n 120 "$GITHUB_WORKSPACE/out/build.log"
            exit "$rc"
          fi

          file "$GITHUB_WORKSPACE/out/warp10" | tee "$GITHUB_WORKSPACE/out/file.txt"
          grep -Eqi 'Mach-O.*arm|Mach-O.*ARM' "$GITHUB_WORKSPACE/out/file.txt"
          sha256sum "$GITHUB_WORKSPACE/out/warp10" > "$GITHUB_WORKSPACE/out/warp10.sha256"

      - name: Create jailbreak DEB
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p buildpkg/DEBIAN buildpkg/usr/bin buildpkg/etc/warp10
          install -m 0755 out/warp10 buildpkg/usr/bin/warp10
          echo '' | base64 -d > buildpkg/DEBIAN/control
          echo '' | base64 -d > buildpkg/DEBIAN/postinst
          echo 'IyEvYmluL3NoCmlmIFsgLXggL3Vzci9iaW4vd2FycDEwIF07IHRoZW4KICAgIC91c3IvYmluL3dhcnAxMCBkb3duID4vZGV2L251bGwgMj4mMSB8fCB0cnVlCmZpCmV4aXQgMAo=' | base64 -d > buildpkg/DEBIAN/prerm
          echo '' | base64 -d > buildpkg/etc/warp10/warp.conf.example
          chmod 0755 buildpkg/DEBIAN/postinst buildpkg/DEBIAN/prerm
          dpkg-deb --root-owner-group --build buildpkg out/warp10-ios10-armv7.deb
          dpkg-deb -I out/warp10-ios10-armv7.deb
          sha256sum out/warp10-ios10-armv7.deb > out/warp10-ios10-armv7.deb.sha256

      - name: Upload ready package
        uses: actions/upload-artifact@v4
        with:
          name: warp10-ios10-armv7
          path: |
            out/warp10-ios10-armv7.deb
            out/warp10-ios10-armv7.deb.sha256
            out/warp10
            out/warp10.sha256
            out/file.txt
          if-no-files-found: error
